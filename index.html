<meta name="mobile-web-app-capable" content="yes">

<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app de uma coluna (até 640px), cabeçalho fixo no topo, abas fixas embaixo. Visual escuro de oficina, um acento que vem da cor da barbearia. */
:root{
  color-scheme: dark;
  --bg:#0E0E10; --surface:#17171A; --surface2:#111114; --line:#26262B; --line2:#2E2E35;
  --fg:#F2F2F3; --muted:#A1A1AA; --dim:#8A8A93;
  --accent:#8B9BFF; --accent-ink:#0E0E10; --accent-soft:#1E2033;
  --ok:#5BD08A; --ok-soft:#12201A; --ok-line:#23402F;
  --warn:#F0B44C; --warn-soft:#1C1A14; --warn-line:#5A4A26;
  --bad:#F07C6C; --bad-line:#4A2A26;
  --font:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.top small{display:block;font-size:13px;color:var(--muted)}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
main{flex:1;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:6px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{min-height:56px;border:none;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;cursor:pointer;border-radius:12px}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tight{padding:14px;gap:8px;border-radius:14px}
.card.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.card.ok{background:var(--ok-soft);border-color:var(--ok-line)}
.card.alert{border-color:var(--warn-line)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.sub{font-size:13px;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.h2{margin:0;font-size:17px;font-weight:600}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-warn{color:var(--warn)} .c-acc{color:var(--accent)} .c-muted{color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--warn);border-color:var(--warn-line)}
.btn.bad{color:var(--bad);border-color:var(--bad-line)}
.btn.ok{color:var(--ok);border-color:var(--ok-line)}
.btn.full{width:100%}
.btn.lg{min-height:52px;font-size:16px;border-radius:14px}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--dim);cursor:default}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--fg2);font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{color:var(--dim);text-decoration:line-through;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:56px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.pick.on{border:2px solid var(--accent);padding:9px 11px}
.pick:disabled{opacity:.45;cursor:default}
.pick b{font-size:14px;font-weight:600}
.pick span{font-size:12px;color:var(--muted)}
.slot{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{min-height:48px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--fg);font-size:16px}
textarea{padding:12px 14px;min-height:90px;resize:vertical;line-height:1.4}
input.small{min-height:44px;font-size:15px;padding:0 10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.hora{font-size:16px;font-weight:700;width:52px;flex-shrink:0}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.msg{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.45;color:var(--fg2);user-select:text}
.empty{text-align:center;color:var(--muted);padding:24px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.sw{width:44px;height:44px;border-radius:999px;border:3px solid var(--bg);cursor:pointer}
.sw.on{border-color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;background:#F2F2F3;color:#0E0E10;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.err{background:var(--bad);color:#140806}
@media (max-width:380px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qr{background:#fff;border-radius:12px;padding:10px;width:160px;height:160px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qr img,.qr canvas{width:140px!important;height:140px!important}
.link{font-size:14px;color:var(--accent);font-weight:500;word-break:break-all;user-select:text}

/* ===== Estilo couro e madeira =====
   Fundo de couro escuro com textura fina, cabeçalho e abas em madeira com friso de latão,
   costura pespontada nos cartões, títulos em serifa clássica e destaques dourados. */
:root{
  --bg:#1A120D; --surface:#271B13; --surface2:#1F160F; --line:#3B2B1F; --line2:#4E3929;
  --fg:#F3E9DA; --fg2:#E6D8C3; --muted:#C4AF95; --dim:#A08A73;
  --accent:#C9A35B; --accent-ink:#1A120D; --accent-soft:#3A2B1C;
  --ok:#8CC79A; --ok-soft:#1C2418; --ok-line:#3A5236;
  --warn:#E3AE57; --warn-soft:#2A1F12; --warn-line:#6B4E25;
  --bad:#E48A72; --bad-line:#5E3326;
  --wood-1:#3B2617; --wood-2:#4A3020; --wood-3:#2C1C11;
  --stitch:rgba(201,163,91,.30);
  --font:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display:'Playfair Display', Georgia, 'Times New Roman', serif;
}
body{font-size:16px;background-color:var(--bg);background-image:radial-gradient(rgba(255,235,205,.03) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.22) 1px,transparent 1px);background-size:3px 3px,5px 5px;background-position:0 0,1px 2px}
body::before{background:var(--wood-2)}
.top,.tabs{background-color:var(--wood-1);background-image:repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 13px,rgba(0,0,0,.10) 13px 14px,rgba(255,220,170,.04) 14px 29px,rgba(0,0,0,.07) 29px 31px),linear-gradient(180deg,var(--wood-2),var(--wood-3))}
.top{border-bottom:2px solid var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tabs{border-top:2px solid var(--accent);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.top h1{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:0}
.top small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.logo{width:46px;height:46px;border-radius:999px;background:var(--bg);color:var(--accent);border:2px solid var(--accent);font-family:var(--display);font-size:21px;box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--stitch)}
.tab{color:var(--muted);font-size:12px;font-weight:600}
.tab.on{color:var(--accent);background:rgba(0,0,0,.22)}
.card{position:relative;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,235,205,.05),0 2px 10px rgba(0,0,0,.25)}
.card.costura::after{content:"";position:absolute;inset:5px;border:1px dashed var(--stitch);border-radius:10px;pointer-events:none}
.card.tight{box-shadow:inset 0 1px 0 rgba(255,235,205,.04)}
.h2{font-family:var(--display);font-size:20px;font-weight:700}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:lining-nums tabular-nums;letter-spacing:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{border-radius:10px}
.btn.pri,.chip.on,.slot.on{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(0,0,0,.14));border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.4)}
.btn:disabled{background-image:none;box-shadow:none}
.pick.on{border-color:var(--accent)}
.badge{background:var(--accent-soft);border-color:var(--line2);color:var(--accent)}
.msg{color:var(--fg2)}
.sw{border-color:var(--bg)}
#toast{background:var(--fg);color:var(--bg);border:1px solid var(--accent)}
.empty{font-family:var(--font)}
.abertura{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:28px 6px}
.selo{width:88px;height:88px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;background-color:var(--wood-1);background-image:linear-gradient(180deg,var(--wood-2),var(--wood-3));box-shadow:inset 0 0 0 4px var(--wood-3),inset 0 0 0 5px var(--stitch),0 6px 18px rgba(0,0,0,.4)}
.nome-app{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;text-wrap:balance}

/* ===== Mascote, animações e detalhes =====
   O barbeiro bigodudo aparece no login, no Início, nos vazios e nas comemorações.
   As animações são curtas e somem pra quem pede menos movimento no celular. */
body{background-image:radial-gradient(rgba(255,235,205,.022) 1px,transparent 1px);background-size:4px 4px}
.masc{display:inline-flex;flex-shrink:0;line-height:0;cursor:pointer}
.masc svg{width:100%;height:100%;overflow:visible}
.masc .m-olhos{transform-box:view-box;transform-origin:100px 96px;animation:piscar 5s infinite}
.masc .m-bigode{transform-box:view-box;transform-origin:100px 118px}
.masc .m-gravata{transform-box:view-box;transform-origin:100px 172px}
.m-hero{width:86px;height:95px;animation:flutuar 3.4s ease-in-out infinite}
.m-hero .m-bigode{animation:bigode 7s ease-in-out infinite}
.m-grande{width:132px;height:145px}
.m-med{width:64px;height:70px}
.m-peq{width:72px;height:79px;opacity:.95}
.m-festa{animation:pular .55s ease-in-out 3}
.m-festa .m-bigode,.m-cutuca .m-bigode{animation:bigodeRapido .45s ease-in-out 2}
.m-festa .m-gravata,.m-cutuca .m-gravata{animation:gravata .45s ease-in-out 2}
.m-cutuca{animation:cutuca .5s ease-in-out}
@keyframes piscar{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bigode{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-6deg)}92%{transform:rotate(6deg)}96%{transform:rotate(-3deg)}}
@keyframes bigodeRapido{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
@keyframes gravata{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pular{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-12px) rotate(-5deg)}75%{transform:translateY(0) rotate(4deg)}}
@keyframes cutuca{0%,100%{transform:scale(1)}40%{transform:scale(1.08) rotate(-3deg)}}
.hero{background-color:#2C1E15;background-image:radial-gradient(120% 90% at 0% 0%,rgba(201,163,91,.16),transparent 60%);gap:14px}
.hero .row{align-items:flex-end;gap:12px}
.balao{position:relative;flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line2);border-radius:14px 14px 14px 4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.balao::before{content:"";position:absolute;left:-7px;bottom:10px;width:12px;height:12px;background:var(--surface2);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
.balao b{font-family:var(--display);font-size:19px;font-weight:700}
.balao span{font-size:15px;color:var(--fg2)}
.mini>div{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.mini b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.item .grow .pill{margin-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.p-ok{color:var(--ok);border-color:var(--ok-line)} .p-warn{color:var(--warn);border-color:var(--warn-line)} .p-acc{color:var(--accent);border-color:var(--line2)}
.item.agora{background:rgba(140,199,154,.06);border-radius:10px;padding:8px;border-bottom:none}
.logo{overflow:hidden;background:#3A2B1C}
.logo svg{width:100%;height:100%}
.logo.tem-logo{background:#fff}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-prev{width:84px;height:84px;border-radius:999px;border:2px solid var(--accent);background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-prev img{width:100%;height:100%;object-fit:cover;background:#fff}
.logo-prev .masc{width:70px;height:77px}
.abertura .masc{filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.empty .masc{align-self:center}
.festa-card{position:relative;overflow:hidden}
.confete{position:absolute;inset:0;pointer-events:none}
.confete i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;background:var(--accent);animation:cair 1.6s ease-in forwards}
.confete i:nth-child(3n){background:var(--ok)} .confete i:nth-child(4n){background:#E8D9BE} .confete i:nth-child(5n){background:var(--bad)}
.confete i:nth-child(1){left:6%;animation-delay:0s}.confete i:nth-child(2){left:13%;animation-delay:.1s}.confete i:nth-child(3){left:21%;animation-delay:.25s}.confete i:nth-child(4){left:29%;animation-delay:.05s}.confete i:nth-child(5){left:37%;animation-delay:.3s}.confete i:nth-child(6){left:45%;animation-delay:.15s}.confete i:nth-child(7){left:53%;animation-delay:.4s}.confete i:nth-child(8){left:61%;animation-delay:.2s}.confete i:nth-child(9){left:69%;animation-delay:.05s}.confete i:nth-child(10){left:77%;animation-delay:.35s}.confete i:nth-child(11){left:85%;animation-delay:.12s}.confete i:nth-child(12){left:92%;animation-delay:.28s}.confete i:nth-child(13){left:49%;animation-delay:.5s}.confete i:nth-child(14){left:25%;animation-delay:.45s}
@keyframes cair{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(210px) rotate(540deg);opacity:0}}
.poste{width:22px;height:64px;border-radius:11px;border:3px solid var(--accent);overflow:hidden;background:#F3E9DA;display:block;align-self:center}
.poste i{display:block;height:200%;background:repeating-linear-gradient(-45deg,#B23A3A 0 8px,#F3E9DA 8px 16px,#2F5A9E 16px 24px,#F3E9DA 24px 32px);animation:girar 1s linear infinite}
@keyframes girar{from{transform:translateY(-45.25px)}to{transform:translateY(0)}}
.carregando{padding-top:64px}
#view.entra>*{animation:subir .42s cubic-bezier(.2,.7,.3,1) both}
#view.entra>*:nth-child(2){animation-delay:.04s}#view.entra>*:nth-child(3){animation-delay:.08s}#view.entra>*:nth-child(4){animation-delay:.12s}#view.entra>*:nth-child(5){animation-delay:.16s}#view.entra>*:nth-child(6){animation-delay:.2s}#view.entra>*:nth-child(n+7){animation-delay:.24s}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn,.chip,.pick,.slot,.tab,.sw{transition:transform .12s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:active,.chip:active,.pick:active,.slot:active,.sw:active{transform:scale(.96)}
.tab.on svg{animation:aba .35s ease-out}
@keyframes aba{0%{transform:translateY(0)}40%{transform:translateY(-4px)}100%{transform:translateY(0)}}
#toast:not([hidden]){animation:toast .28s cubic-bezier(.2,.8,.3,1)}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.tab{position:relative}
.badge-n{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#1A0A06;font-size:11px;font-weight:700;line-height:18px;text-align:center}

-sob" d="M68 82 C74 74 86 74 92 80" stroke="#3A2416" stroke-width="6" stroke-linecap="round" fill="none"/><path class="m-sob" d="M108 80 C114 74 126 74 132 82" stroke="#3A2416" stroke-width="6" stroke-linecap="round" fill="none"/><g class="m-olhos"><ellipse cx="80" cy="96" rx="7" ry="8.5" fill="#2A1B12"/><ellipse cx="120" cy="96" rx="7" ry="8.5" fill="#2A1B12"/><circle cx="82.5" cy="93" r="2.4" fill="#FFFFFF"/><circle cx="122.5" cy="93" r="2.4" fill="#FFFFFF"/></g><ellipse cx="68" cy="116" rx="9" ry="5.5" fill="#E58E7A" opacity=".45"/><ellipse cx="132" cy="116" rx="9" ry="5.5" fill="#E58E7A" opacity=".45"/><path d="M100 98 C96 108 92 114 96 118 C99 120 104 120 106 117" stroke="#C98763" stroke-width="3" fill="#E3A781" stroke-linecap="round"/><path class="m-boca" d="M88 134 C94 142 106 142 112 134 C106 137 94 137 88 134 Z" fill="#8E2F35"/><g class="m-bigode"><path d="M100 120 C92 116 80 116 72 124 C66 130 58 132 52 128 C46 124 46 116 52 114 C48 120 54 124 58 120 C62 116 66 112 74 112 C84 112 94 114 100 118 C106 114 116 112 126 112 C134 112 138 116 142 120 C146 124 152 120 148 114 C154 116 154 124 148 128 C142 132 134 130 128 124 C120 116 108 116 100 120 Z" fill="#3A2416"/><path d="M100 119 C92 115 82 116 76 120 C86 116 94 117 100 121 Z" fill="#5B3A24"/></g></svg>';

  const horaDe = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const FORMAS = ['Pix', 'Cartão', 'Dinheiro'];
  const sinalExpirado = (a) => !a.sinalExpira || new Date(a.sinalExpira) <= new Date();
  // Horário preso: marcado, em andamento, feito, ou esperando o sinal dentro do prazo.
  const segura = (a) => ['agendado', 'cadeira', 'feito'].indexOf(a.status) >= 0 || (a.status === 'aguardando_sinal' && !sinalExpirado(a));

  const DEF = {
    nome: 'Minha Barbearia', cor: '#C9A35B', abre: '09:00', fecha: '19:00', intervalo: 30, metaMes: 20000,
    servicos: [
      { id: 'corte', nome: 'Corte', preco: 45, dur: 40, custo: 3 },

      { id: 'combo', nome: 'Corte + barba', preco: 70, dur: 60, custo: 6 },

  };
  const CORES = [['#C9A35B', 'Latão'], ['#C8814F', 'Cobre'], ['#D2A877', 'Couro claro'], ['#C0646B', 'Vinho'], ['#8FAF7A', 'Verde musgo'], ['#E8D9BE', 'Creme']];
  // Cores do visual antigo viram o latão do novo visual.
  const corMarca = (c) => (!c || ['#8B9BFF', '#E8B04B', '#5BD08A', '#F07C6C', '#C792EA', '#F2F2F3'].indexOf(String(c).toUpperCase()) >= 0 ? '#C9A35B' : c);
  const TABS = ['inicio', 'agenda', 'caixa', 'clientes', 'gestao', 'agendar', 'barbeiro'];
  const TITULOS = { inicio: 'Resumo do dia', agenda: 'Agenda', caixa: 'Caixa e comanda', clientes: 'Clientes', gestao: 'Gestão', agendar: 'Novo agendamento', barbeiro: 'Modo barbeiro' };
  const titulo = (tab) => (tab === 'gestao' && S.papel === 'barbeiro' ? 'Sua conta' : TITULOS[tab]);

  const S = {

          sem[String(d)] = { abre: e.abre, fecha: e.fecha };

      const i = Number(el.dataset.id); const k = el.dataset.v; const n = cfg().servicos.slice();
      if (!n[i]) return; const o = Object.assign({}, n[i]); o[k] = k === 'nome' ? (el.value.trim() || o.nome) : num(el.value); n[i] = o;
      salvarCfg({ servicos: n });
    }
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'A' || el.disabled) return;
    e.preventDefault();
    const fn = A[el.dataset.act]; if (fn) Promise.resolve(fn(el)).catch(() => toast('Algo deu errado. Tente de novo.', true));
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.f) S.f[el.dataset.f] = el.value;
    if (el.dataset.inp === 'busca') { S.f.busca = el.value; filtrarBusca(el.value); }
    if (el.id === 'st-nome' && S.f.stSlug === undefined) { const sl = document.getElementById('st-slug'); if (sl) sl.value = slugify(el.value); }
    if (el.id === 'bk-nome') { const btn = document.querySelector('[data-act="bkSalvar"]'); if (btn) btn.disabled = !(serv(S.ui.bk.serv) && S.ui.bk.hora && el.value.trim()); }
  });
  document.addEventListener('change', (e) => { const el = e.target; if (el.dataset.chg && C[el.dataset.chg]) C[el.dataset.chg](el); });
  // ---------- aviso de agendamento novo ----------
  let audioCtx = null;
  document.addEventListener('pointerdown', () => {
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { audioCtx = null; }
  }, { passive: true });
  function tocarSom() {
    if (!audioCtx || !prefSom()) return;
    try {
      const t0 = audioCtx.currentTime;
      [[880, 0], [1320, 0.16]].forEach(([f, d]) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.5);
        o.start(t0 + d); o.stop(t0 + d + 0.55);
      });
    } catch (e) { /* sem som */ }
  }
  function checarNovos() {
    if (!S.knownAg) return;
    const novos = [];
    S.ags.forEach((a) => { if (!S.knownAg.has(a.id)) { S.knownAg.add(a.id); if (a.origem === 'link' && (!souBarbeiro() || a.barbeiroId === S.meuBarb)) novos.push(a); } });
    if (novos.length) avisar(novos);
  }
  let avisoT = null;
  function avisar(lista, teste) {
    const a = lista[lista.length - 1]; const s = serv(a.servicoId);
    const quando = (a.data === today() ? 'hoje' : fmtDia(a.data)) + ' às ' + a.hora;
    const txt = primeiroNome(a.clienteNome) + ' marcou ' + (s ? s.nome.toLowerCase() : 'um horário') + ' ' + quando + ' com ' + barbNome(a.barbeiroId) + (a.status === 'aguardando_sinal' ? '. Esperando o Pix do sinal.' : '.');
    if (!teste) S.novos = (S.novos || 0) + lista.length;
    const el = document.getElementById('aviso');
    el.innerHTML = '<div class="aviso-in">' + mascote('m-festa m-aviso') + '<div class="grow"><b>' + (lista.length > 1 ? lista.length + ' agendamentos novos!' : 'Agendamento novo!') + '</b><span>' + esc(txt) + '</span></div>' +
      '<div class="stack"><button type="button" class="btn sm pri" data-act="avisoVer" data-v="' + esc(a.data) + '">Ver</button><button type="button" class="btn sm" data-act="avisoFechar" aria-label="Fechar aviso">✕</button></div></div>';
    el.hidden = false; clearTimeout(avisoT); avisoT = setTimeout(() => { el.hidden = true; }, 12000);
    const bg = document.getElementById('badge-agenda'); if (bg && S.novos) { bg.hidden = false; bg.textContent = S.novos > 9 ? '9+' : String(S.novos); }
    tocarSom();
    try { if (navigator.vibrate) navigator.vibrate([120, 80, 120]); } catch (e) { /* sem vibração */ }
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        const n = new Notification(lista.length > 1 ? lista.length + ' agendamentos novos' : 'Agendamento novo', { body: txt, icon: 'icon-192.png?v=3', tag: 'agendamento-' + a.id });
        n.onclick = () => { window.focus(); S.ui.agDia = a.data; go('agenda'); n.close(); };
      }
    } catch (e) { /* sem notificação */ }
    if (S.ui.tab === 'inicio' || S.ui.tab === 'agenda') scheduleRender();
  }

  // Logo: reduz a imagem no próprio celular antes de salvar (fica leve e carrega rápido).
  async function processarLogo(file) {
    if (!file || !/^image\//.test(file.type)) { toast('Escolha uma imagem (PNG ou JPG).', true); return; }
    if (file.size > 10 * 1024 * 1024) { toast('Imagem muito grande. Use uma de até 10 MB.', true); return; }
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const r = Math.min(1, 256 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * r)), hh = Math.max(1, Math.round(img.height * r));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(img, 0, 0, w, hh);
      let data = cv.toDataURL('image/webp', 0.9);
      if (data.indexOf('data:image/webp') !== 0) data = cv.toDataURL('image/png');
      if (data.length > 300000) data = cv.toDataURL('image/jpeg', 0.85);
      if (await salvarCfg({ logo: data })) toast('Logo atualizada');
    } catch (e) { toast('Não deu pra ler essa imagem. Tente outra.', true); }
    finally { URL.revokeObjectURL(url); }
  }
  document.addEventListener('change', (e) => { if (e.target.id === 'bb-logo-file' && e.target.files && e.target.files[0]) processarLogo(e.target.files[0]); });
  // Tocar no mascote faz ele mexer o bigode.
  document.addEventListener('click', (e) => {
    const m = e.target.closest && e.target.closest('.masc'); if (!m) return;
    m.classList.remove('m-cutuca'); void m.offsetWidth; m.classList.add('m-cutuca');
    setTimeout(() => m.classList.remove('m-cutuca'), 900);
  });
  // ENTER num campo envia o formulário (login, cadastro e qualquer cartão com um botão principal).
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const el = e.target;
    if (!el || el.tagName !== 'INPUT' || el.dataset.chg || el.type === 'search') return;
    const card = el.closest('.card'); if (!card) return;
    const pri = card.querySelectorAll('.btn.pri'); if (pri.length !== 1 || pri[0].disabled) return;
    e.preventDefault(); if (el.dataset.f) S.f[el.dataset.f] = el.value;
    el.blur(); pri[0].click();
  });
  document.addEventListener('focusout', () => { setTimeout(() => { if (S.dirty) { const a = document.activeElement; if (!(a && a.closest && a.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) { S.dirty = false; render(); } } }, 0); });
  window.addEventListener('hashchange', fromHash);

  // ---------- inicialização ----------
  // Ponte entre as telas e o Supabase: cada registro é uma linha da tabela "registros".
  const KEY = { produtos: 'produtos', agendamentos: 'ags', comandas: 'comandas', clientes: 'clientes', despesas: 'despesas', vales: 'vales' };
  function localSet(c, id, data) {
    const k = KEY[c]; if (!k) return;
    const arr = S[k].slice(); const i = arr.findIndex((x) => x.id === id); const row = Object.assign({}, data, { id: id });
    if (i >= 0) arr[i] = row; else arr.push(row);
    S[k] = arr; if (c === 'agendamentos') checarNovos(); scheduleRender();
  }
  function localDel(c, id) { const k = KEY[c]; if (!k) return; S[k] = S[k].filter((x) => x.id !== id); scheduleRender(); }
  const semId = (o) => { const c = Object.assign({}, o); delete c.id; return c; };
  function docRef(c, id) {
    return {
      set: async (data) => {
        const r = await S.sb.from('registros').upsert({ barbearia_id: S.bid, colecao: c, id: id, dados: data });
        if (r.error) throw r.error; localSet(c, id, data);
      },
      update: async (patch) => {
        const atual = (S[KEY[c]] || []).find((x) => x.id === id);
        const data = Object.assign({}, atual ? semId(atual) : {}, patch);
        const r = await S.sb.from('registros').upsert({ barbearia_id: S.bid, colecao: c, id: id, dados: data });
        if (r.error) throw r.error; localSet(c, id, data);
      },
      delete: async () => {
        const r = await S.sb.from('registros').delete().eq('barbearia_id', S.bid).eq('colecao', c).eq('id', id);
        if (r.error) throw r.error; localDel(c, id);
      }
    };
  }
  const DB = {
    doc: (path) => {
      const p = path.split('/');
      if (p[0] === 'config') return {
        set: async (novo) => {
          const r = await S.sb.from('barbearias').update({ nome: novo.nome, config: novo }).eq('id', S.bid).select('id');
          if (r.error) throw r.error;
          if (!r.data || !r.data.length) throw { amigavel: 'Só o dono pode mudar as configurações da barbearia.' };
          S.cfg = novo; applyTheme(); scheduleRender();
        }
      };
      return docRef(p[0], p[1]);
    },
    collection: (c) => ({ doc: (id) => docRef(c, id) })
  };

  async function carregarRegistros() {
    let tudo = [], de = 0;
    for (;;) {
      const r = await S.sb.from('registros').select('colecao,id,dados').eq('barbearia_id', S.bid).range(de, de + 999);
      if (r.error) throw r.error;
      tudo = tudo.concat(r.data || []); if (!r.data || r.data.length < 1000) break; de += 1000;
    }
    const novo = { produtos: [], ags: [], comandas: [], clientes: [], despesas: [], vales: [] };
    tudo.forEach((x) => { const k = KEY[x.colecao]; if (k) novo[k].push(Object.assign({}, x.dados, { id: x.id })); });
    Object.assign(S, novo);
  }
  async function carregarAcessos() {
    if (S.papel !== 'dono') return;
    const cv = await S.sb.from('convites').select('email,papel,barbeiro_id').eq('barbearia_id', S.bid);
    S.convites = cv.data || [];
    const ac = await S.sb.rpc('equipe_acessos', { p_b: S.bid });
    S.acessos = Array.isArray(ac.data) ? ac.data : []; S.nMembros = S.acessos.length; scheduleRender();
  }
  async function carregarBarbearia() {
    S.status = 'loading'; render();
    try {
      await S.sb.rpc('entrar_por_convite');
      const m = await S.sb.from('membros').select('barbearia_id,papel,barbeiro_id').eq('user_id', S.user.id);
      if (m.error) throw m.error;
      if (!m.data || !m.data.length) { S.status = 'setup'; render(); return; }
      S.bid = m.data[0].barbearia_id; S.papel = m.data[0].papel; S.meuBarb = m.data[0].barbeiro_id || null;
      if (S.papel === 'barbeiro') { S.ui.agBarb = S.meuBarb || 'todos'; S.ui.barbView = S.meuBarb; }
      const b = await S.sb.from('barbearias').select('id,slug,nome,config,vencimento').eq('id', S.bid).maybeSingle();
      if (b.error) throw b.error;
      if (!b.data) { S.status = 'inativa'; render(); return; }
      S.slug = b.data.slug; S.venc = b.data.vencimento || null; S.cfg = Object.assign({}, DEF, b.data.config || {}, { nome: b.data.nome });
      applyTheme();
      await carregarRegistros();
      S.knownAg = new Set(S.ags.map((a) => a.id));
      S.sb.channel('barbearia-' + S.bid)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'registros', filter: 'barbearia_id=eq.' + S.bid }, (p) => {
          if (p.eventType === 'DELETE') { if (p.old && p.old.id) localDel(p.old.colecao, p.old.id); }
          else if (p.new) localSet(p.new.colecao, p.new.id, p.new.dados || {});
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'barbearias', filter: 'id=eq.' + S.bid }, (p) => {
          if (p.new && p.new.config) { S.cfg = Object.assign({}, DEF, p.new.config, { nome: p.new.nome }); applyTheme(); scheduleRender(); }
        })
        .subscribe();
      S.status = 'ok'; render();
      carregarAcessos();
    } catch (e) {
      S.status = 'login'; render(); toast('Não deu pra carregar a barbearia. Confira a internet e entre de novo.', true);
    }
  }
  async function sincronizar() {
    if (S.status !== 'ok' || document.hidden) return;
    try { await carregarRegistros(); checarNovos(); scheduleRender(); } catch (e) { /* tenta de novo no próximo ciclo */ }
  }

  // Aceita a URL colada com sobras: barra no final, /rest/v1, ou o endereço do painel do Supabase.
  function urlSupabase(u) {
    u = String(u || '').trim();
    const painel = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
    if (painel) u = 'https://' + painel[1] + '.supabase.co';
    u = u.replace(/\/(rest|auth|storage|realtime)\/v1.*$/i, '').replace(/\/+$/, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  async function boot() {
    const t = (location.hash || '').replace('#', ''); if (TABS.indexOf(t) >= 0) S.ui.tab = t;
    render();
    const C = window.APP_CONFIG || {};
    if (!window.supabase || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || /COLE_AQUI/.test(C.SUPABASE_URL + C.SUPABASE_ANON_KEY)) { S.status = 'semconfig'; render(); return; }
    S.sb = window.supabase.createClient(urlSupabase(C.SUPABASE_URL), String(C.SUPABASE_ANON_KEY).trim());
    S.db = DB;
    S.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'PASSWORD_RECOVERY') { S.user = session && session.user; S.status = 'novaSenha'; render(); return; }
      if (ev === 'SIGNED_IN' && session && !S.user) { S.user = session.user; setTimeout(carregarBarbearia, 0); }
    });
    const sess = await S.sb.auth.getSession();
    if (S.status === 'novaSenha') return;
    if (sess.data && sess.data.session) { S.user = sess.data.session.user; await carregarBarbearia(); }
    else { S.status = 'login'; render(); }
    setInterval(sincronizar, 60000);
    document.addEventListener('visibilitychange', sincronizar);
    setInterval(() => { if (S.status === 'ok' && (S.ui.tab === 'inicio' || S.ui.tab === 'agenda')) scheduleRender(); }, 60000);
  }
  boot();
})();
</script>
